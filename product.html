<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail | Luma Atelier</title>
    <meta
      name="description"
      content="Explore rich product pages with gallery zoom, variant selection, pricing, and stock-aware purchasing."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="product">
    <div class="site-shell">
      <div class="promo-banner">
        <span>Summer Sale</span>
        <strong>Select seasonal essentials now ship with elevated savings.</strong>
        <a href="catalog.html">Browse collection</a>
      </div>
      <header class="topbar" data-sticky-nav>
        <a class="brandmark" href="index.html">
          <img class="brandmark__logo" src="assets/img/favicon.svg" alt="Luma Atelier" />
          <span class="brandmark__name">
            <strong>Luma Atelier</strong>
            <span>Premium Commerce</span>
          </span>
        </a>
        <nav class="nav-links">
          <a href="catalog.html">Shop</a>
          <a href="account.html">Account</a>
          <a href="admin.html">Admin</a>
        </nav>
        <div class="nav-actions">
          <a class="icon-button icon-button--cart" href="checkout.html">
            <span>Cart</span>
            <strong data-cart-count>0</strong>
          </a>
        </div>
      </header>

      <main class="section product-page" data-product-page></main>
    </div>

    <aside class="assistant-widget" data-assistant>
      <button class="assistant-toggle" type="button" data-assistant-toggle aria-expanded="false">
        Assistant
      </button>
      <div class="assistant-panel" hidden>
        <div class="assistant-panel__header">
          <div>
            <span class="eyebrow">Luma Concierge</span>
            <strong>Shopping assistant</strong>
          </div>
          <button type="button" class="assistant-close" data-assistant-close aria-label="Close assistant">×</button>
        </div>
        <div class="assistant-messages" data-assistant-messages></div>
        <div class="assistant-actions">
          <button type="button" class="chip" data-assistant-prompt="Show similar items">Similar items</button>
          <button type="button" class="chip" data-assistant-prompt="Is this good for gifting?">Gift advice</button>
          <button type="button" class="chip" data-assistant-prompt="What should I pair with this?">Pair with this</button>
        </div>
        <form class="assistant-form" data-assistant-form>
          <input type="text" name="message" placeholder="Ask about this product..." />
          <button class="button button--primary" type="submit">Send</button>
        </form>
      </div>
    </aside>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
